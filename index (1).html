<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7C2D3D" />
<title>Painel da Corretora</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  body { margin: 0; background: #FAF7F2; -webkit-font-smoothing: antialiased; }
  * { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #erro-fatal { display:none; padding:24px; font-family: monospace; font-size:13px; color:#B0413E; background:#FBEAEA; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="erro-fatal"></div>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("erro-fatal");
    box.style.display = "block";
    box.textContent = "Erro ao carregar o painel:\n" + (e.message || e.error);
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ====== CONFIG ======
const API_URL = "https://gestao-inove.onrender.com";

// ====== CORES ======
const COLORS = {
  bg: "#FAF7F2", panel: "#FFFFFF", ink: "#221D19", inkSoft: "#6B6259",
  line: "#E7DFD3", burgundy: "#7C2D3D", camel: "#B8935F", camelDeep: "#93733F",
  slate: "#8B8578", green: "#4F7942", red: "#B0413E",
};

// ====== ÍCONES ======
function Svg({ size = 16, color = "currentColor", sw = 2, children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
         strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
         style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0 }}>
      {children}
    </svg>
  );
}
const Plus = (p) => <Svg {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Svg>;
const X = (p) => <Svg {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Svg>;
const ChevronLeft = (p) => <Svg {...p}><path d="m15 18-6-6 6-6"/></Svg>;
const ChevronRight = (p) => <Svg {...p}><path d="m9 18 6-6-6-6"/></Svg>;
const Trash2 = (p) => <Svg {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></Svg>;
const Shield = (p) => <Svg {...p}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></Svg>;
const ShieldCheck = (p) => <Svg {...p}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></Svg>;
const Clock = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></Svg>;
const CalendarIcon = (p) => <Svg {...p}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></Svg>;
const CalendarPlus = (p) => <Svg {...p}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M12 14v4"/><path d="M10 16h4"/></Svg>;
const DollarSign = (p) => <Svg {...p}><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Svg>;
const TrendingUp = (p) => <Svg {...p}><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></Svg>;
const TrendingDown = (p) => <Svg {...p}><path d="M22 17 13.5 8.5 8.5 13.5 2 7"/><path d="M16 17h6v-6"/></Svg>;
const Wallet = (p) => <Svg {...p}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></Svg>;
const LayoutGrid = (p) => <Svg {...p}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></Svg>;
const PenLine = (p) => <Svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></Svg>;
const Hourglass = (p) => <Svg {...p}><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></Svg>;
const Check = (p) => <Svg {...p}><path d="M20 6 9 17l-5-5"/></Svg>;
const RefreshCw = (p) => <Svg {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></Svg>;

// ====== DADOS FIXOS ======
const STATUSES = [
  { key: "iniciado", label: "Iniciado", color: COLORS.slate },
  { key: "cotacao", label: "Cotação enviada", color: "#7C93C7" },
  { key: "aguardando", label: "Aguardando retorno", color: COLORS.camel },
  { key: "recusado", label: "Cliente recusou", color: COLORS.red },
  { key: "aceito", label: "Cliente aceitou", color: COLORS.green },
  { key: "finalizado", label: "Proposta finalizada", color: COLORS.burgundy },
];
const CATEGORIAS = [
  { key: "seguro", label: "Seguro", color: COLORS.burgundy, icon: Shield },
  { key: "certificado", label: "Certificação Digital", color: COLORS.camel, icon: ShieldCheck },
];
const SUBTIPOS = {
  seguro: [
    { key: "auto", label: "Seguro Auto" },
    { key: "vida", label: "Seguro de Vida" },
    { key: "residencial", label: "Seguro Residencial" },
    { key: "empresarial", label: "Seguro Empresarial" },
    { key: "rc", label: "Responsabilidade Civil" },
    { key: "bike", label: "Seguro de Bike" },
    { key: "saude", label: "Seguro Saúde" },
    { key: "viagem", label: "Seguro Viagem" },
    { key: "celular", label: "Seguro Celular/Eletrônicos" },
    { key: "outro", label: "Outro seguro" },
  ],
  certificado: [
    { key: "ecpf", label: "e-CPF" },
    { key: "ecnpj", label: "e-CNPJ" },
  ],
};
const FORMAS_PAGAMENTO = ["Pix", "Cartão de crédito", "Cartão de débito", "Boleto", "Dinheiro"];

// ====== HELPERS ======
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtMoney(v) { return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function fmtDatePt(s) { if (!s) return ""; const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; }
function categoriaInfo(k) { return CATEGORIAS.find((c) => c.key === k) || CATEGORIAS[0]; }
function subtipoLabel(cat, sub) {
  const found = (SUBTIPOS[cat] || []).find((s) => s.key === sub);
  return found ? found.label : "";
}

// ====== API ======
async function apiGet(path) {
  const r = await fetch(API_URL + path);
  if (!r.ok) throw new Error("GET " + path);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(API_URL + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error("POST " + path);
  return r.json();
}
async function apiPatch(path, body) {
  const r = await fetch(API_URL + path, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error("PATCH " + path);
  return r.json();
}
async function apiDelete(path) {
  const r = await fetch(API_URL + path, { method: "DELETE" });
  if (!r.ok && r.status !== 204) throw new Error("DELETE " + path);
}

function mapAtendimento(row) {
  return {
    id: row.id, cliente: row.cliente, categoria: row.categoria, subtipo: row.subtipo,
    horarioSolicitado: row.horario_solicitado || "",
    dataAgendamento: row.data_agendamento ? String(row.data_agendamento).slice(0, 10) : "",
    horarioAgendamento: row.horario_agendamento || "",
    valor: row.valor != null ? parseFloat(row.valor) : null,
    pagamento: row.pagamento || "",
    status: row.status, notas: row.notas || "", criadoEm: row.criado_em,
  };
}
function mapAgendamento(row) {
  return {
    id: row.id, cliente: row.cliente, categoria: row.categoria, subtipo: row.subtipo,
    data: row.data ? String(row.data).slice(0, 10) : "", horario: row.horario,
    notas: row.notas || "", atendimentoId: row.atendimento_id,
  };
}
function mapFinanceiro(row) {
  return {
    id: row.id, cliente: row.cliente, categoria: row.categoria, subtipo: row.subtipo,
    valorPago: parseFloat(row.valor_pago) || 0, custo: parseFloat(row.custo) || 0,
    forma: row.forma || "", data: row.data ? String(row.data).slice(0, 10) : "",
    pago: row.pago !== false,
  };
}

// ====== COMPONENTES BASE ======
function Stamp({ categoria, subtipo }) {
  const info = categoriaInfo(categoria);
  const Icon = info.icon;
  return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium"
          style={{ backgroundColor: info.color + "1A", color: info.color }}>
      <Icon size={12} color={info.color} sw={2.5} />
      {subtipoLabel(categoria, subtipo) || info.label}
    </span>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6"
         style={{ backgroundColor: "rgba(34,29,25,0.45)" }} onClick={onClose}>
      <div className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl overflow-hidden"
           style={{ backgroundColor: COLORS.panel, maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: `1px solid ${COLORS.line}` }}>
          <h3 className="text-base font-semibold" style={{ color: COLORS.ink, fontFamily: "Georgia, serif" }}>{title}</h3>
          <button onClick={onClose} className="p-1 rounded-full hover:bg-black/5"><X size={18} color={COLORS.inkSoft} /></button>
        </div>
        <div className="px-5 py-4 overflow-y-auto" style={{ maxHeight: "76vh" }}>{children}</div>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div className="mb-3">
      <label className="block text-xs font-medium mb-1" style={{ color: COLORS.inkSoft }}>{label}</label>
      {children}
    </div>
  );
}

const inputStyle = {
  width: "100%", padding: "10px 11px", borderRadius: "10px", border: `1px solid ${COLORS.line}`,
  fontSize: "16px", color: COLORS.ink, backgroundColor: "#FDFBF8", outline: "none",
};

function PrimaryButton({ children, onClick }) {
  return (
    <button type="button" onClick={onClick} className="w-full py-3 rounded-xl font-medium text-sm"
            style={{ backgroundColor: COLORS.burgundy, color: "#fff" }}>{children}</button>
  );
}

function Toggle({ ativo, onClick, cor, children }) {
  return (
    <button type="button" onClick={onClick} className="flex-1 py-2.5 rounded-xl text-xs font-medium border"
            style={{
              borderColor: ativo ? cor : COLORS.line,
              backgroundColor: ativo ? cor + "1A" : "transparent",
              color: ativo ? cor : COLORS.inkSoft,
            }}>{children}</button>
  );
}

function CategoriaSubtipoPicker({ categoria, setCategoria, subtipo, setSubtipo }) {
  return (
    <React.Fragment>
      <Field label="Categoria">
        <div className="flex gap-2">
          {CATEGORIAS.map((c) => (
            <Toggle key={c.key} ativo={categoria === c.key} cor={c.color}
                    onClick={() => { setCategoria(c.key); setSubtipo(SUBTIPOS[c.key][0].key); }}>
              {c.label}
            </Toggle>
          ))}
        </div>
      </Field>
      <Field label={categoria === "seguro" ? "Qual seguro?" : "Qual certificado?"}>
        <select style={inputStyle} value={subtipo} onChange={(e) => setSubtipo(e.target.value)}>
          {(SUBTIPOS[categoria] || []).map((o) => <option key={o.key} value={o.key}>{o.label}</option>)}
        </select>
      </Field>
    </React.Fragment>
  );
}

// ====== ATENDIMENTOS ======
function AddAtendimentoModal({ onClose, onSave }) {
  const [cliente, setCliente] = useState("");
  const [categoria, setCategoria] = useState("seguro");
  const [subtipo, setSubtipo] = useState(SUBTIPOS.seguro[0].key);
  const [horarioSolicitado, setHorarioSolicitado] = useState("");
  const [dataAgendamento, setDataAgendamento] = useState("");
  const [horarioAgendamento, setHorarioAgendamento] = useState("");
  const [valor, setValor] = useState("");
  const [pagamento, setPagamento] = useState("pago");
  const [forma, setForma] = useState(FORMAS_PAGAMENTO[0]);
  const [notas, setNotas] = useState("");

  const submit = () => {
    if (!cliente.trim()) return;
    onSave({
      id: uid(), cliente: cliente.trim(), categoria, subtipo,
      horarioSolicitado, dataAgendamento, horarioAgendamento,
      valor: valor ? parseFloat(valor) : null,
      pagamento: valor ? pagamento : "",
      forma: valor && pagamento === "pago" ? forma : "",
      status: "iniciado", notas: notas.trim(), criadoEm: new Date().toISOString(),
    });
    onClose();
  };

  return (
    <Modal title="Novo atendimento" onClose={onClose}>
      <Field label="Cliente">
        <input style={inputStyle} value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Nome do cliente" autoFocus />
      </Field>
      <CategoriaSubtipoPicker categoria={categoria} setCategoria={setCategoria} subtipo={subtipo} setSubtipo={setSubtipo} />
      <Field label="Horário em que o cliente solicitou">
        <input type="time" style={inputStyle} value={horarioSolicitado} onChange={(e) => setHorarioSolicitado(e.target.value)} />
      </Field>

      <div className="rounded-xl p-3 mb-3" style={{ backgroundColor: "#F2ECE2" }}>
        <div className="flex items-center gap-1.5 mb-2">
          <CalendarPlus size={14} color={COLORS.camelDeep} />
          <span className="text-xs font-semibold" style={{ color: COLORS.camelDeep }}>Agendamento (opcional)</span>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <Field label="Data">
            <input type="date" style={inputStyle} value={dataAgendamento} onChange={(e) => setDataAgendamento(e.target.value)} />
          </Field>
          <Field label="Horário">
            <input type="time" style={inputStyle} value={horarioAgendamento} onChange={(e) => setHorarioAgendamento(e.target.value)} />
          </Field>
        </div>
        <p className="text-[11px]" style={{ color: COLORS.inkSoft }}>Preenchendo data e horário, o compromisso vai automaticamente para o calendário.</p>
      </div>

      {categoria === "certificado" && (
        <div className="rounded-xl p-3 mb-3" style={{ backgroundColor: "#F2ECE2" }}>
          <div className="flex items-center gap-1.5 mb-2">
            <DollarSign size={14} color={COLORS.burgundy} />
            <span className="text-xs font-semibold" style={{ color: COLORS.burgundy }}>Valor do certificado</span>
          </div>
          <Field label="Valor (R$)">
            <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={valor}
                   onChange={(e) => setValor(e.target.value)} placeholder="0,00" />
          </Field>
          {valor && (
            <React.Fragment>
              <Field label="Situação">
                <div className="flex gap-2">
                  <Toggle ativo={pagamento === "pago"} cor={COLORS.green} onClick={() => setPagamento("pago")}>Pago</Toggle>
                  <Toggle ativo={pagamento === "pendente"} cor={COLORS.camelDeep} onClick={() => setPagamento("pendente")}>Pendente</Toggle>
                </div>
              </Field>
              {pagamento === "pago" && (
                <Field label="Forma de pagamento">
                  <select style={inputStyle} value={forma} onChange={(e) => setForma(e.target.value)}>
                    {FORMAS_PAGAMENTO.map((f) => <option key={f} value={f}>{f}</option>)}
                  </select>
                </Field>
              )}
              <p className="text-[11px]" style={{ color: COLORS.inkSoft }}>
                {pagamento === "pago"
                  ? "Este valor será somado ao Recebido no financeiro."
                  : "Este valor entra em A receber e não soma no Recebido até você marcar como pago."}
              </p>
            </React.Fragment>
          )}
        </div>
      )}

      <Field label="Observações">
        <textarea style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} value={notas}
                  onChange={(e) => setNotas(e.target.value)} placeholder="Detalhes do pedido..." />
      </Field>
      <PrimaryButton onClick={submit}>Adicionar atendimento</PrimaryButton>
    </Modal>
  );
}

function AtendimentoCard({ item, onMove, onDelete }) {
  const info = categoriaInfo(item.categoria);
  return (
    <div className="rounded-xl p-3 mb-2.5 relative"
         style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}`, boxShadow: "0 1px 2px rgba(34,29,25,0.04)" }}>
      <div className="absolute top-0 right-0"
           style={{ width: 0, height: 0, borderStyle: "solid", borderWidth: "0 16px 16px 0",
                    borderColor: `transparent ${info.color} transparent transparent`, borderTopRightRadius: "12px", opacity: 0.9 }} />
      <div className="mb-1.5 pr-4">
        <span className="text-sm font-semibold" style={{ color: COLORS.ink }}>{item.cliente}</span>
      </div>
      <div className="mb-2"><Stamp categoria={item.categoria} subtipo={item.subtipo} /></div>
      {item.horarioSolicitado && (
        <div className="flex items-center gap-1 text-xs mb-1" style={{ color: COLORS.inkSoft }}>
          <Clock size={12} color={COLORS.inkSoft} /> Solicitado às {item.horarioSolicitado}
        </div>
      )}
      {item.dataAgendamento && (
        <div className="flex items-center gap-1 text-xs mb-1" style={{ color: COLORS.camelDeep }}>
          <CalendarPlus size={12} color={COLORS.camelDeep} /> Agendado {fmtDatePt(item.dataAgendamento)}{item.horarioAgendamento ? ` às ${item.horarioAgendamento}` : ""}
        </div>
      )}
      {item.valor != null && item.valor > 0 && (
        <div className="flex items-center gap-1.5 text-xs mb-1">
          <span className="font-bold" style={{ color: COLORS.ink, fontFamily: "ui-monospace, monospace" }}>{fmtMoney(item.valor)}</span>
          <span className="px-1.5 py-0.5 rounded-full text-[10px] font-medium"
                style={{ backgroundColor: item.pagamento === "pendente" ? COLORS.camel + "26" : COLORS.green + "1A",
                         color: item.pagamento === "pendente" ? COLORS.camelDeep : COLORS.green }}>
            {item.pagamento === "pendente" ? "Pendente" : "Pago"}
          </span>
        </div>
      )}
      {item.notas && <p className="text-xs mt-1 mb-2" style={{ color: COLORS.inkSoft }}>{item.notas}</p>}
      <div className="flex items-center gap-1.5 mt-2">
        <select value={item.status} onChange={(e) => onMove(item.id, e.target.value)}
                className="flex-1 text-xs py-1.5 px-2 rounded-lg"
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink, backgroundColor: "#FDFBF8" }}>
          {STATUSES.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
        </select>
        <button onClick={() => onDelete(item.id)} className="p-1.5 rounded-lg hover:bg-black/5">
          <Trash2 size={14} color={COLORS.inkSoft} />
        </button>
      </div>
    </div>
  );
}

function KanbanBoard({ atendimentos, onAdd, onMove, onDelete }) {
  const [showAdd, setShowAdd] = useState(false);
  const today = todayStr();
  const hojeCount = atendimentos.filter((a) => (a.criadoEm || "").slice(0, 10) === today).length;

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="text-lg font-semibold" style={{ color: COLORS.ink, fontFamily: "Georgia, serif" }}>Atendimentos</h2>
          <p className="text-xs" style={{ color: COLORS.inkSoft }}>{hojeCount} recebido(s) hoje · {atendimentos.length} no total</p>
        </div>
        <button onClick={() => setShowAdd(true)}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium"
                style={{ backgroundColor: COLORS.burgundy, color: "#fff" }}>
          <Plus size={16} color="#fff" /> Novo
        </button>
      </div>

      <div className="flex gap-3 overflow-x-auto pb-3">
        {STATUSES.map((s) => {
          const items = atendimentos.filter((a) => a.status === s.key);
          return (
            <div key={s.key} className="flex-shrink-0" style={{ width: 250 }}>
              <div className="flex items-center gap-2 mb-2 px-1">
                <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: s.color }} />
                <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>{s.label}</span>
                <span className="text-xs ml-auto" style={{ color: COLORS.inkSoft }}>{items.length}</span>
              </div>
              <div className="rounded-2xl p-2" style={{ backgroundColor: "#F2ECE2", minHeight: 80 }}>
                {items.length === 0 && <p className="text-xs text-center py-6" style={{ color: COLORS.inkSoft }}>Vazio</p>}
                {items.map((item) => <AtendimentoCard key={item.id} item={item} onMove={onMove} onDelete={onDelete} />)}
              </div>
            </div>
          );
        })}
      </div>

      {showAdd && <AddAtendimentoModal onClose={() => setShowAdd(false)} onSave={onAdd} />}
    </div>
  );
}

// ====== CALENDÁRIO ======
function AddAgendamentoModal({ dateStr, onClose, onSave }) {
  const [cliente, setCliente] = useState("");
  const [categoria, setCategoria] = useState("seguro");
  const [subtipo, setSubtipo] = useState(SUBTIPOS.seguro[0].key);
  const [horario, setHorario] = useState("09:00");
  const [notas, setNotas] = useState("");

  const submit = () => {
    if (!cliente.trim()) return;
    onSave({ id: uid(), cliente: cliente.trim(), categoria, subtipo, data: dateStr, horario, notas: notas.trim() });
    onClose();
  };

  return (
    <Modal title={`Agendar · ${fmtDatePt(dateStr)}`} onClose={onClose}>
      <Field label="Cliente">
        <input style={inputStyle} value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Nome do cliente" autoFocus />
      </Field>
      <CategoriaSubtipoPicker categoria={categoria} setCategoria={setCategoria} subtipo={subtipo} setSubtipo={setSubtipo} />
      <Field label="Horário">
        <input type="time" style={inputStyle} value={horario} onChange={(e) => setHorario(e.target.value)} />
      </Field>
      <Field label="Observações">
        <textarea style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} value={notas} onChange={(e) => setNotas(e.target.value)} />
      </Field>
      <PrimaryButton onClick={submit}>Salvar agendamento</PrimaryButton>
    </Modal>
  );
}

function CalendarView({ agendamentos, onAdd, onDelete }) {
  const [cursor, setCursor] = useState(new Date());
  const [selectedDay, setSelectedDay] = useState(todayStr());
  const [showAdd, setShowAdd] = useState(false);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const dateStrFor = (d) => `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const countFor = (d) => agendamentos.filter((a) => a.data === dateStrFor(d)).length;
  const monthLabel = cursor.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  const dayItems = agendamentos.filter((a) => a.data === selectedDay).sort((a, b) => (a.horario || "").localeCompare(b.horario || ""));

  return (
    <div>
      <h2 className="text-lg font-semibold mb-4" style={{ color: COLORS.ink, fontFamily: "Georgia, serif" }}>Calendário</h2>

      <div className="rounded-2xl p-4 mb-4" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
        <div className="flex items-center justify-between mb-3">
          <button onClick={() => setCursor(new Date(year, month - 1, 1))} className="p-1.5 rounded-lg hover:bg-black/5">
            <ChevronLeft size={18} color={COLORS.inkSoft} />
          </button>
          <span className="text-sm font-semibold capitalize" style={{ color: COLORS.ink }}>{monthLabel}</span>
          <button onClick={() => setCursor(new Date(year, month + 1, 1))} className="p-1.5 rounded-lg hover:bg-black/5">
            <ChevronRight size={18} color={COLORS.inkSoft} />
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">
          {["D", "S", "T", "Q", "Q", "S", "S"].map((d, i) => (
            <div key={i} className="text-center text-xs font-medium py-1" style={{ color: COLORS.inkSoft }}>{d}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (d === null) return <div key={i} />;
            const ds = dateStrFor(d);
            const isSel = ds === selectedDay;
            const isToday = ds === todayStr();
            const count = countFor(d);
            return (
              <button key={i} onClick={() => setSelectedDay(ds)}
                      className="aspect-square rounded-lg flex items-center justify-center relative text-xs"
                      style={{ backgroundColor: isSel ? COLORS.burgundy : isToday ? "#F2ECE2" : "transparent",
                               color: isSel ? "#fff" : COLORS.ink, fontWeight: isToday ? 700 : 500 }}>
                {d}
                {count > 0 && <span className="absolute bottom-1 w-1.5 h-1.5 rounded-full"
                                    style={{ backgroundColor: isSel ? "#fff" : COLORS.camel }} />}
              </button>
            );
          })}
        </div>
      </div>

      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-semibold" style={{ color: COLORS.ink }}>{fmtDatePt(selectedDay)}</h3>
        <button onClick={() => setShowAdd(true)} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium"
                style={{ backgroundColor: COLORS.camel + "1A", color: COLORS.camelDeep }}>
          <Plus size={13} color={COLORS.camelDeep} /> Agendar
        </button>
      </div>

      {dayItems.length === 0 && (
        <p className="text-sm py-6 text-center rounded-xl" style={{ color: COLORS.inkSoft, backgroundColor: "#F2ECE2" }}>Nenhum agendamento neste dia</p>
      )}
      <div className="space-y-2">
        {dayItems.map((item) => (
          <div key={item.id} className="rounded-xl p-3 flex items-center gap-3"
               style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
            <div className="text-center flex-shrink-0" style={{ width: 46 }}>
              <div className="text-sm font-bold" style={{ color: COLORS.ink }}>{item.horario}</div>
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-medium truncate" style={{ color: COLORS.ink }}>{item.cliente}</div>
              <Stamp categoria={item.categoria} subtipo={item.subtipo} />
              {item.notas && <p className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>{item.notas}</p>}
            </div>
            <button onClick={() => onDelete(item.id)} className="p-1.5 rounded-lg hover:bg-black/5 flex-shrink-0">
              <Trash2 size={14} color={COLORS.inkSoft} />
            </button>
          </div>
        ))}
      </div>

      {showAdd && <AddAgendamentoModal dateStr={selectedDay} onClose={() => setShowAdd(false)} onSave={onAdd} />}
    </div>
  );
}

// ====== FINANCEIRO ======
function AddFinanceModal({ onClose, onSave }) {
  const [cliente, setCliente] = useState("");
  const [categoria, setCategoria] = useState("seguro");
  const [subtipo, setSubtipo] = useState(SUBTIPOS.seguro[0].key);
  const [valorPago, setValorPago] = useState("");
  const [custo, setCusto] = useState("");
  const [forma, setForma] = useState(FORMAS_PAGAMENTO[0]);
  const [data, setData] = useState(todayStr());
  const [pago, setPago] = useState(true);

  const submit = () => {
    if (!cliente.trim() || !valorPago) return;
    onSave({
      id: uid(), cliente: cliente.trim(), categoria, subtipo,
      valorPago: parseFloat(valorPago) || 0, custo: parseFloat(custo) || 0,
      forma: pago ? forma : "", data, pago,
    });
    onClose();
  };

  return (
    <Modal title="Novo lançamento" onClose={onClose}>
      <Field label="Cliente">
        <input style={inputStyle} value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Nome do cliente" autoFocus />
      </Field>
      <CategoriaSubtipoPicker categoria={categoria} setCategoria={setCategoria} subtipo={subtipo} setSubtipo={setSubtipo} />
      <div className="grid grid-cols-2 gap-2">
        <Field label="Valor (R$)">
          <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={valorPago}
                 onChange={(e) => setValorPago(e.target.value)} placeholder="0,00" />
        </Field>
        <Field label="Custo (R$)">
          <input type="number" step="0.01" inputMode="decimal" style={inputStyle} value={custo}
                 onChange={(e) => setCusto(e.target.value)} placeholder="0,00" />
        </Field>
      </div>
      <Field label="Situação">
        <div className="flex gap-2">
          <Toggle ativo={pago} cor={COLORS.green} onClick={() => setPago(true)}>Pago</Toggle>
          <Toggle ativo={!pago} cor={COLORS.camelDeep} onClick={() => setPago(false)}>Pendente</Toggle>
        </div>
      </Field>
      {pago && (
        <Field label="Forma de pagamento">
          <select style={inputStyle} value={forma} onChange={(e) => setForma(e.target.value)}>
            {FORMAS_PAGAMENTO.map((f) => <option key={f} value={f}>{f}</option>)}
          </select>
        </Field>
      )}
      <Field label="Data">
        <input type="date" style={inputStyle} value={data} onChange={(e) => setData(e.target.value)} />
      </Field>
      <PrimaryButton onClick={submit}>Salvar lançamento</PrimaryButton>
    </Modal>
  );
}

function Card({ titulo, valor, cor, Icon, destaque }) {
  return (
    <div className="rounded-2xl p-4"
         style={{ backgroundColor: destaque ? COLORS.burgundy : COLORS.panel,
                  border: destaque ? "none" : `1px solid ${cor === COLORS.camelDeep ? COLORS.camel : COLORS.line}` }}>
      <div className="flex items-center gap-1.5 mb-1" style={{ color: destaque ? "#F2D9DE" : cor }}>
        <Icon size={14} color={destaque ? "#F2D9DE" : cor} />
        <span className="text-xs font-medium">{titulo}</span>
      </div>
      <div className="text-lg font-bold"
           style={{ color: destaque ? "#fff" : (cor === COLORS.camelDeep ? COLORS.camelDeep : COLORS.ink),
                    fontFamily: "ui-monospace, monospace" }}>{fmtMoney(valor)}</div>
    </div>
  );
}

function FinanceView({ financeiro, onAdd, onDelete, onMarcarPago }) {
  const [showAdd, setShowAdd] = useState(false);

  const totalRecebido = financeiro.filter((f) => f.pago).reduce((s, f) => s + (f.valorPago || 0), 0);
  const totalAReceber = financeiro.filter((f) => !f.pago).reduce((s, f) => s + (f.valorPago || 0), 0);
  const totalCusto = financeiro.reduce((s, f) => s + (f.custo || 0), 0);
  const lucro = totalRecebido - totalCusto;
  const sorted = [...financeiro].sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-lg font-semibold" style={{ color: COLORS.ink, fontFamily: "Georgia, serif" }}>Financeiro</h2>
        <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium"
                style={{ backgroundColor: COLORS.burgundy, color: "#fff" }}>
          <Plus size={16} color="#fff" /> Lançar
        </button>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-5">
        <Card titulo="Recebido" valor={totalRecebido} cor={COLORS.green} Icon={TrendingUp} />
        <Card titulo="A receber" valor={totalAReceber} cor={COLORS.camelDeep} Icon={Hourglass} />
        <Card titulo="Custo" valor={totalCusto} cor={COLORS.red} Icon={TrendingDown} />
        <Card titulo="Lucro líquido" valor={lucro} cor={COLORS.burgundy} Icon={Wallet} destaque />
      </div>

      {sorted.length === 0 && (
        <p className="text-sm py-6 text-center rounded-xl" style={{ color: COLORS.inkSoft, backgroundColor: "#F2ECE2" }}>Nenhum lançamento ainda</p>
      )}
      <div className="space-y-2">
        {sorted.map((f) => (
          <div key={f.id} className="rounded-xl p-3" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.line}` }}>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <div className="text-sm font-semibold truncate" style={{ color: COLORS.ink }}>{f.cliente}</div>
                <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                  <Stamp categoria={f.categoria} subtipo={f.subtipo} />
                  {!f.pago && (
                    <span className="px-2 py-0.5 rounded-full text-xs font-medium"
                          style={{ backgroundColor: COLORS.camel + "26", color: COLORS.camelDeep }}>Pendente</span>
                  )}
                  <span className="text-xs" style={{ color: COLORS.inkSoft }}>{f.forma ? f.forma + " · " : ""}{fmtDatePt(f.data)}</span>
                </div>
              </div>
              <button onClick={() => onDelete(f.id)} className="p-1.5 rounded-lg hover:bg-black/5 flex-shrink-0">
                <Trash2 size={14} color={COLORS.inkSoft} />
              </button>
            </div>
            <div className="flex items-center gap-4 mt-2 pt-2" style={{ borderTop: `1px dashed ${COLORS.line}` }}>
              <div>
                <span className="text-[10px] block" style={{ color: COLORS.inkSoft }}>{f.pago ? "Pago" : "A receber"}</span>
                <span className="text-sm font-bold" style={{ color: f.pago ? COLORS.green : COLORS.camelDeep, fontFamily: "ui-monospace, monospace" }}>
                  {fmtMoney(f.valorPago)}
                </span>
              </div>
              <div>
                <span className="text-[10px] block" style={{ color: COLORS.inkSoft }}>Custo</span>
                <span className="text-sm font-bold" style={{ color: COLORS.red, fontFamily: "ui-monospace, monospace" }}>{fmtMoney(f.custo)}</span>
              </div>
              {!f.pago && (
                <button onClick={() => onMarcarPago(f.id)}
                        className="ml-auto flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium"
                        style={{ backgroundColor: COLORS.green + "1A", color: COLORS.green }}>
                  <Check size={13} color={COLORS.green} /> Marcar como pago
                </button>
              )}
            </div>
          </div>
        ))}
      </div>

      {showAdd && <AddFinanceModal onClose={() => setShowAdd(false)} onSave={onAdd} />}
    </div>
  );
}

// ====== APP ======
function App() {
  const [tab, setTab] = useState("kanban");
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState("");
  const [atendimentos, setAtendimentos] = useState([]);
  const [agendamentos, setAgendamentos] = useState([]);
  const [financeiro, setFinanceiro] = useState([]);

  const carregarTudo = async () => {
    setLoading(true); setErro("");
    try {
      const [a, ag, f] = await Promise.all([
        apiGet("/api/atendimentos"), apiGet("/api/agendamentos"), apiGet("/api/financeiro"),
      ]);
      setAtendimentos(a.map(mapAtendimento));
      setAgendamentos(ag.map(mapAgendamento));
      setFinanceiro(f.map(mapFinanceiro));
    } catch (e) {
      console.error(e);
      setErro("Não foi possível conectar ao servidor. Ele pode estar 'acordando' — aguarde até 1 minuto e tente de novo.");
    } finally { setLoading(false); }
  };

  useEffect(() => { carregarTudo(); }, []);

  const addAtendimento = async (item) => {
    setAtendimentos((prev) => [item, ...prev]);
    try {
      await apiPost("/api/atendimentos", item);
      if (item.dataAgendamento && item.horarioAgendamento) {
        const ag = { id: uid(), cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
                     data: item.dataAgendamento, horario: item.horarioAgendamento, notas: item.notas, atendimentoId: item.id };
        setAgendamentos((prev) => [...prev, ag]);
        await apiPost("/api/agendamentos", ag);
      }
      if (item.categoria === "certificado" && item.valor > 0) {
        const lanc = { id: uid(), cliente: item.cliente, categoria: item.categoria, subtipo: item.subtipo,
                       valorPago: item.valor, custo: 0, forma: item.forma || "",
                       data: item.dataAgendamento || todayStr(), pago: item.pagamento !== "pendente" };
        setFinanceiro((prev) => [lanc, ...prev]);
        await apiPost("/api/financeiro", lanc);
      }
    } catch (e) { console.error(e); setErro("Não foi possível salvar o atendimento no servidor."); }
  };
  const moveAtendimento = async (id, status) => {
    setAtendimentos((prev) => prev.map((a) => (a.id === id ? { ...a, status } : a)));
    try { await apiPatch(`/api/atendimentos/${id}`, { status }); }
    catch (e) { console.error(e); setErro("Não foi possível atualizar o status."); }
  };
  const deleteAtendimento = async (id) => {
    setAtendimentos((prev) => prev.filter((a) => a.id !== id));
    try { await apiDelete(`/api/atendimentos/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir."); }
  };
  const addAgendamento = async (item) => {
    setAgendamentos((prev) => [...prev, item]);
    try { await apiPost("/api/agendamentos", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar o agendamento."); }
  };
  const deleteAgendamento = async (id) => {
    setAgendamentos((prev) => prev.filter((a) => a.id !== id));
    try { await apiDelete(`/api/agendamentos/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir."); }
  };
  const addFinanceiro = async (item) => {
    setFinanceiro((prev) => [item, ...prev]);
    try { await apiPost("/api/financeiro", item); }
    catch (e) { console.error(e); setErro("Não foi possível salvar o lançamento."); }
  };
  const deleteFinanceiro = async (id) => {
    setFinanceiro((prev) => prev.filter((f) => f.id !== id));
    try { await apiDelete(`/api/financeiro/${id}`); }
    catch (e) { console.error(e); setErro("Não foi possível excluir."); }
  };
  const marcarPago = async (id) => {
    setFinanceiro((prev) => prev.map((f) => (f.id === id ? { ...f, pago: true } : f)));
    try { await apiPatch(`/api/financeiro/${id}`, { pago: true }); }
    catch (e) { console.error(e); setErro("Não foi possível atualizar o pagamento."); }
  };

  const tabs = [
    { key: "kanban", label: "Atendimentos", icon: LayoutGrid },
    { key: "calendario", label: "Calendário", icon: CalendarIcon },
    { key: "financeiro", label: "Financeiro", icon: Wallet },
  ];

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: COLORS.bg }}>
        <span className="text-sm" style={{ color: COLORS.inkSoft }}>Conectando ao servidor...</span>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: COLORS.bg }}>
      <div className="px-4 pt-6 pb-3 sticky top-0 z-10" style={{ backgroundColor: COLORS.bg }}>
        <div className="flex items-center gap-2 mb-1">
          <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ backgroundColor: COLORS.burgundy }}>
            <PenLine size={16} color="#fff" />
          </div>
          <h1 className="text-xl font-bold" style={{ color: COLORS.ink, fontFamily: "Georgia, serif" }}>Painel da Corretora</h1>
          <button onClick={carregarTudo} className="ml-auto p-2 rounded-lg hover:bg-black/5" title="Atualizar">
            <RefreshCw size={16} color={COLORS.inkSoft} />
          </button>
        </div>
        <p className="text-xs mb-4" style={{ color: COLORS.inkSoft }}>Seguros · Certificação Digital</p>

        <div className="flex gap-1 p-1 rounded-xl" style={{ backgroundColor: "#F2ECE2" }}>
          {tabs.map((t) => {
            const Icon = t.icon;
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)}
                      className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-semibold"
                      style={{ backgroundColor: active ? COLORS.panel : "transparent",
                               color: active ? COLORS.burgundy : COLORS.inkSoft,
                               boxShadow: active ? "0 1px 3px rgba(34,29,25,0.08)" : "none" }}>
                <Icon size={14} color={active ? COLORS.burgundy : COLORS.inkSoft} /> {t.label}
              </button>
            );
          })}
        </div>
      </div>

      <div className="px-4 pb-10">
        {erro && (
          <div className="rounded-xl p-3 mb-4 text-xs flex items-center justify-between gap-2"
               style={{ backgroundColor: "#FBEAEA", color: COLORS.red }}>
            <span>{erro}</span>
            <button onClick={carregarTudo} className="font-semibold underline flex-shrink-0">Tentar de novo</button>
          </div>
        )}
        {tab === "kanban" && <KanbanBoard atendimentos={atendimentos} onAdd={addAtendimento} onMove={moveAtendimento} onDelete={deleteAtendimento} />}
        {tab === "calendario" && <CalendarView agendamentos={agendamentos} onAdd={addAgendamento} onDelete={deleteAgendamento} />}
        {tab === "financeiro" && <FinanceView financeiro={financeiro} onAdd={addFinanceiro} onDelete={deleteFinanceiro} onMarcarPago={marcarPago} />}
      </div>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  const box = document.getElementById("erro-fatal");
  box.style.display = "block";
  box.textContent = "Erro ao carregar o painel:\n" + e.message;
}
</script>
</body>
